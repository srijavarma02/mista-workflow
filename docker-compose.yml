version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stores_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stores_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stores_pass}
      POSTGRES_DB: ${DB_NAME:-stores_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stores_user -d stores_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stores_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stores_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  postgres_data:
